<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pablo & Evren Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }

    header {
      background-image: url("https://your-image-link-here.jpg");
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    header h1 {
      font-size: 60px;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 10px;
    }

    .section {
      padding: 50px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      margin: 10px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: gray;
    }
  </style>
</head>

<body>

<header>
  <h1>Pablo & Evren Tour</h1>
</header>

<div class="section">
  <h2>Explore</h2>

  <a href="#tour" class="btn">Tour Dates</a>
  <a href="#gallery" class="btn">Gallery</a>
  <a href="#about" class="btn">About Us</a>
  <a href="#music" class="btn">Listen Now</a>
  <a href="#contact" class="btn">Contact</a>
</div>

<div id="tour" class="section">
  <h2>Tour Dates</h2>
  <p>Coming soon...</p>
</div>

<div id="gallery" class="section">
  <h2>Gallery</h2>
  <p>Add your photos/videos here</p>
</div>

<div id="about" class="section">
  <h2>About Pablo & Evren</h2>
  <p>Your story here</p>
</div>

<div id="music" class="section">
  <h2>Listen Now</h2>
  <p>Embed Spotify / YouTube here</p>
</div>

<div id="contact" class="section">
  <h2>Contact</h2>
  <p>Email: your@email.com</p>
</div>

</body>
</html>
